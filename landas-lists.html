<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1f44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Landa's Lists">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #06101c; }
    h1, h2 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.5px; }
    .app-frame { border: 8px solid #06101c; box-shadow: 0 0 0 2px #163a6b; }
    .dark body, body.dark { background: #06101c; }
    .splash-bg { background: linear-gradient(to bottom right, #071428, #0a1f44, #000); }
    .navy-grad { background: linear-gradient(90deg, #0a1f44, #163a6b); }
    .ll-soft { color: #d5e3f5; }
    .ll-ink { color: #0a1f44; }
    .ll-link { color: #12315c; }
    .ll-btn { background: #12315c; color: #fff; }
    body.dark .app-frame { background: #0d1b2e; color: #f3f4f6; }
    body.dark .bg-white { background: #1f2937 !important; color: #f3f4f6; }
    body.dark .border { border-color: #374151 !important; }
    body.dark .text-gray-500, body.dark .text-gray-600 { color: #9ca3af !important; }
    body.dark .bg-gray-100 { background: #374151 !important; }
    body.dark input, body.dark select { background: #1f2937; color: #f3f4f6; border-color: #4b5563; }
    body.dark .genre-chip, body.dark .platform-toggle { background: #1f2937; color: #e5e7eb; border-color: #4b5563; }
    .genre-chip.selected, .platform-toggle.selected {
      background: #12315c !important;
      color: white !important;
      border-color: #12315c !important;
    }
    body.dark .genre-chip.selected,
    body.dark .platform-toggle.selected,
    body.dark .type-btn.type-on {
      background: #e8eef6 !important;
      color: #0a1f44 !important;
      border-color: #e8eef6 !important;
      box-shadow: 0 0 0 1px #fff, 0 0 18px 3px rgba(200, 214, 232, 0.75) !important;
    }
    body.dark .card { background: #1f2937; border-color: #374151; }
    body.dark nav { background: #111827; border-color: #374151; }
    .skeleton { animation: shimmer 1.8s infinite; background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 200% 100%; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash-bg fixed inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-500">
    <img src="icon.jpg" alt="Landa's Lists" class="w-40 h-40 rounded-3xl shadow-2xl mb-6">
    <h1 class="text-5xl text-yellow-400">Landa's Lists</h1>
    <p class="ll-soft mt-1 text-sm">Find your next favorite</p>
    <button id="enterBtn" class="mt-10 px-12 py-3 rounded-full bg-yellow-400 ll-ink font-semibold tracking-[0.25em] text-sm shadow-lg">ENTER</button>
  </div>

  <div class="max-w-md mx-auto bg-white min-h-screen app-frame relative">
    <!-- Header -->
    <header class="navy-grad text-white p-5 sticky top-0 z-20">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <button id="backBtn" class="hidden p-2 rounded-full hover:bg-white/20" title="Back">
            <i class="fas fa-arrow-left text-xl"></i>
          </button>
          <div>
            <h1 class="text-2xl">Landa's Lists</h1>
            <p class="ll-soft text-sm">Find your next favorite</p>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <button id="darkToggle" class="p-2 rounded-full hover:bg-white/20" title="Toggle dark mode">
            <i id="darkIcon" class="fas fa-moon text-xl"></i>
          </button>
          <button id="settingsBtn" class="p-2 rounded-full hover:bg-white/20">
            <i class="fas fa-cog text-xl"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end justify-center">
      <div class="bg-white w-full max-w-md rounded-t-3xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl">Settings</h2>
          <button id="closeSettings" class="text-2xl">&times;</button>
        </div>
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <span>Dark Mode</span>
            <button id="settingsDarkToggle" class="relative w-12 h-6 bg-gray-300 rounded-full">
              <span id="settingsDarkKnob" class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform"></span>
            </button>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">TMDB API Key</label>
            <input id="apiKeyInput" type="password" placeholder="Get free key at themoviedb.org" value="ed8d56e224716858d23dd28f22d8238c" class="w-full border rounded-xl px-4 py-3">
            <p class="text-xs text-gray-500 mt-1">Free for personal use. <a href="https://www.themoviedb.org/settings/api" target="_blank" class="ll-link underline">Get yours</a></p>
          </div>
          <button id="saveSettings" class="w-full ll-btn text-white py-3 rounded-xl font-semibold">Save</button>
          <div id="locationStatus" class="text-sm text-gray-600"></div>
        </div>
      </div>
    </div>

    <!-- Main -->
    <main class="p-4 pb-28">
      <section class="mb-6">
        <h2 class="text-lg mb-3">What are you in the mood for?</h2>
        <input id="actorInput" type="text" placeholder="Actor, e.g. Tom Hanks" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-4 mb-3">
        <input id="moodInput" type="text" placeholder="Keywords, e.g. time travel, heist" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-4 mb-4">
        <div id="genreChips" class="flex flex-wrap gap-2 mb-4"></div>
        <div class="flex bg-gray-100 rounded-xl p-1 mb-4">
          <button data-type="tv" class="type-btn flex-1 py-2 rounded-lg text-sm">Series</button>
          <button data-type="movie" class="type-btn flex-1 py-2 rounded-lg text-sm">Movies</button>
          <button data-type="both" class="type-btn type-on flex-1 py-2 rounded-lg text-sm bg-white shadow font-semibold">Both</button>
        </div>
      </section>

      <section class="mb-6">
        <h2 class="text-lg mb-3">Your Streaming Services</h2>
        <div id="platformToggles" class="flex flex-wrap gap-2"></div>
      </section>

      <section class="mb-6">
        <div class="flex gap-2">
          <select id="sortBy" class="flex-1 border rounded-xl px-3 py-2 text-sm">
            <option value="popularity.desc">Most Popular</option>
            <option value="date.desc">Newest to oldest</option>
            <option value="date.asc">Oldest to newest</option>
            <option value="vote_average.desc">Highest rated to lowest</option>
            <option value="vote_average.asc">Lowest rated to highest</option>
          </select>
          <button id="searchBtn" class="ll-btn text-white px-6 py-2 rounded-xl font-semibold">Find</button>
        </div>
      </section>

      <section id="resultsSection" class="hidden">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg">Your Lists</h2>
          <span id="resultCount" class="text-sm text-gray-500"></span>
        </div>
        <div id="results" class="space-y-4"></div>
      </section>

      <div id="emptyState" class="text-center py-12 text-gray-400">
        <img src="icon.jpg" alt="Landa's Lists" class="w-32 h-32 mx-auto rounded-3xl shadow-lg mb-6">
        <p class="text-lg font-medium text-gray-600">Tell Landa what you're craving</p>
        <p class="text-sm mt-1">Pick a genre or describe a vibe</p>
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around py-3 z-10">
      <button class="flex flex-col items-center ll-link"><i class="fas fa-home"></i><span class="text-xs mt-1">Discover</span></button>
      <button class="flex flex-col items-center text-gray-400"><i class="fas fa-heart"></i><span class="text-xs mt-1">Saved</span></button>
      <button class="flex flex-col items-center text-gray-400"><i class="fas fa-list"></i><span class="text-xs mt-1">My Lists</span></button>
    </nav>
  </div>

  <script>
    const GENRES = [
      {id:28,name:"Action"},{id:12,name:"Adventure"},{id:16,name:"Animation"},{id:35,name:"Comedy"},
      {id:80,name:"Crime"},{id:99,name:"Documentary"},{id:18,name:"Drama"},{id:10751,name:"Family"},
      {id:14,name:"Fantasy"},{id:36,name:"History"},{id:27,name:"Horror"},{id:9648,name:"Mystery"},
      {id:10749,name:"Romance"},{id:878,name:"Sci-Fi"},{id:53,name:"Thriller"},{id:10752,name:"War"}
    ];
    const PLATFORMS = [
      {id:8,name:"Netflix"},{id:15,name:"Hulu"},{id:337,name:"Disney+"},{id:9,name:"Prime Video"},
      {id:384,name:"Max"},{id:350,name:"Apple TV+"},{id:386,name:"Peacock"},{id:531,name:"Paramount+"}
    ];

    let selectedGenres = new Set();
    let selectedPlatforms = new Set(PLATFORMS.map(p => p.id));
    let selectedType = "both";
    let apiKey = localStorage.getItem("tmdb_api_key") || "ed8d56e224716858d23dd28f22d8238c";
    if (apiKey === "091800b6b76094bf4cee9379a660aab8") {
      apiKey = "ed8d56e224716858d23dd28f22d8238c";
      localStorage.setItem("tmdb_api_key", apiKey);
    }
    let darkMode = localStorage.getItem("dark_mode") === "true";

    document.addEventListener("DOMContentLoaded", () => {
      if (darkMode) document.body.classList.add("dark");
      try { updateDarkUI(); } catch(e) {}

      const splash = document.getElementById("splash");
      const hideSplash = () => {
        if (!splash) return;
        splash.style.opacity = "0";
        setTimeout(() => { splash.style.display = "none"; }, 500);
      };
      const enterBtn = document.getElementById("enterBtn");
      if (enterBtn) enterBtn.addEventListener("click", hideSplash);

      try { renderGenres(); } catch(e) {}
      try { renderPlatforms(); } catch(e) {}
      if (!apiKey) setTimeout(() => {
        const modal = document.getElementById("settingsModal");
        if (modal) modal.classList.remove("hidden");
      }, 800);

      const darkToggle = document.getElementById("darkToggle");
      if (darkToggle) darkToggle.onclick = toggleDark;
      const settingsDarkToggle = document.getElementById("settingsDarkToggle");
      if (settingsDarkToggle) settingsDarkToggle.onclick = toggleDark;
      const settingsBtn = document.getElementById("settingsBtn");
      if (settingsBtn) settingsBtn.onclick = () => document.getElementById("settingsModal").classList.remove("hidden");
      const closeSettings = document.getElementById("closeSettings");
      if (closeSettings) closeSettings.onclick = () => document.getElementById("settingsModal").classList.add("hidden");
      const saveSettingsBtn = document.getElementById("saveSettings");
      if (saveSettingsBtn) saveSettingsBtn.onclick = saveSettings;
      const searchBtn = document.getElementById("searchBtn");
      if (searchBtn) searchBtn.onclick = performSearch;
      const moodInput = document.getElementById("moodInput");
      if (moodInput) moodInput.onkeypress = e => { if (e.key === "Enter") performSearch(); };
      const actorInput = document.getElementById("actorInput");
      if (actorInput) actorInput.onkeypress = e => { if (e.key === "Enter") performSearch(); };
      const backBtn = document.getElementById("backBtn");
      if (backBtn) backBtn.onclick = goBack;

      // Type toggle (Movies / Series / Both)
      document.querySelectorAll(".type-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("bg-white", "shadow", "font-semibold", "type-on"));
          btn.classList.add("bg-white", "shadow", "font-semibold", "type-on");
          selectedType = btn.dataset.type;
        };
      });
    });

    function renderGenres() {
      document.getElementById("genreChips").innerHTML = GENRES.map(g =>
        `<button data-id="${g.id}" class="genre-chip px-4 py-2 rounded-full border text-sm bg-white">${g.name}</button>`
      ).join("");
      document.querySelectorAll(".genre-chip").forEach(btn => {
        btn.onclick = () => {
          const id = +btn.dataset.id;
          if (selectedGenres.has(id)) {
            selectedGenres.delete(id);
            btn.classList.remove("selected");
            btn.style.background = "";
            btn.style.color = "";
            btn.style.borderColor = "";
            btn.style.boxShadow = "";
          } else {
            selectedGenres.add(id);
            btn.classList.add("selected");
          }
        };
      });
    }

    function renderPlatforms() {
      document.getElementById("platformToggles").innerHTML = PLATFORMS.map(p =>
        `<button data-id="${p.id}" class="platform-toggle selected px-3 py-1 rounded-full text-xs border bg-white">${p.name}</button>`
      ).join("");
      document.querySelectorAll(".platform-toggle").forEach(btn => {
        btn.onclick = () => {
          const id = +btn.dataset.id;
          if (selectedPlatforms.has(id)) {
            selectedPlatforms.delete(id);
            btn.classList.remove("selected");
            btn.style.background = "";
            btn.style.color = "";
            btn.style.boxShadow = "";
          } else {
            selectedPlatforms.add(id);
            btn.classList.add("selected");
          }
        };
      });
    }

    function toggleDark() {
      darkMode = !darkMode;
      document.body.classList.toggle("dark", darkMode);
      localStorage.setItem("dark_mode", darkMode);
      updateDarkUI();
    }

    function updateDarkUI() {
      const icon = document.getElementById("darkIcon");
      const knob = document.getElementById("settingsDarkKnob");
      const toggle = document.getElementById("settingsDarkToggle");
      if (darkMode) {
        icon.className = "fas fa-sun text-xl";
        toggle.classList.replace("bg-gray-300","ll-btn");
        knob.style.transform = "translateX(24px)";
      } else {
        icon.className = "fas fa-moon text-xl";
        toggle.classList.replace("ll-btn","bg-gray-300");
        knob.style.transform = "translateX(0)";
      }
    }

    function saveSettings() {
      apiKey = document.getElementById("apiKeyInput").value.trim();
      localStorage.setItem("tmdb_api_key", apiKey);
      document.getElementById("settingsModal").classList.add("hidden");
      if (apiKey) alert("API key saved!");
    }

    function goBack() {
      document.getElementById("resultsSection").classList.add("hidden");
      document.getElementById("emptyState").classList.remove("hidden");
      document.getElementById("backBtn").classList.add("hidden");
      document.getElementById("moodInput").value = "";
      document.getElementById("actorInput").value = "";
    }

    async function performSearch() {
      if (!apiKey) { alert("Add your TMDB API key in Settings first."); document.getElementById("settingsModal").classList.remove("hidden"); return; }
      document.getElementById("emptyState").classList.add("hidden");
      document.getElementById("resultsSection").classList.remove("hidden");
      document.getElementById("backBtn").classList.remove("hidden");
      document.getElementById("results").innerHTML = '<div class="text-center py-8 text-gray-500">Searching...</div>';

      try {
        let results = [];
        const sort = document.getElementById("sortBy").value;
        const keywords = document.getElementById("moodInput").value.trim();
        const actorName = document.getElementById("actorInput").value.trim();
        const castId = actorName ? await findActorId(actorName) : null;
        if (actorName && !castId) throw new Error(`No actor found for “${actorName}”`);
        const keywordIds = keywords ? await findKeywordIds(keywords) : [];
        if (selectedType === "tv" || selectedType === "both") {
          results = results.concat((await searchTMDB("tv", keywordIds, sort, castId)).map(r => ({...r, media_type:"tv"})));
        }
        if (selectedType === "movie" || selectedType === "both") {
          results = results.concat((await searchTMDB("movie", keywordIds, sort, castId)).map(r => ({...r, media_type:"movie"})));
        }
        results = sortResults(results, sort);
        displayResults(results.slice(0,15));
      } catch (e) {
        document.getElementById("results").innerHTML = `
          <div class="text-center text-red-500 py-8 px-4">
            <p class="font-medium">Couldn't load results</p>
            <p class="text-sm mt-2">${e.message}</p>
            <p class="text-xs mt-3 text-gray-500">Make sure your TMDB API key is correct.<br>Data comes from The Movie Database (TMDB) — a free open database.</p>
          </div>`;
      }
    }

    function tmdbSort(type, sort) {
      if (sort === "date.desc") return type === "movie" ? "primary_release_date.desc" : "first_air_date.desc";
      if (sort === "date.asc") return type === "movie" ? "primary_release_date.asc" : "first_air_date.asc";
      return sort;
    }

    function sortResults(results, sort) {
      const desc = !sort.endsWith(".asc");
      const kind = sort.startsWith("date") ? "date" : sort.startsWith("vote") ? "vote" : "pop";
      return results.slice().sort((a, b) => {
        let av, bv;
        if (kind === "date") {
          av = a.release_date || a.first_air_date || "";
          bv = b.release_date || b.first_air_date || "";
          if (av === bv) return 0;
          return (av > bv ? 1 : -1) * (desc ? -1 : 1);
        }
        av = kind === "vote" ? (a.vote_average || 0) : (a.popularity || 0);
        bv = kind === "vote" ? (b.vote_average || 0) : (b.popularity || 0);
        return (av - bv) * (desc ? -1 : 1);
      });
    }

    async function findActorId(name) {
      const res = await fetch(`https://api.themoviedb.org/3/search/person?api_key=${apiKey}&query=${encodeURIComponent(name)}`);
      if (!res.ok) throw new Error("Actor search failed");
      const person = ((await res.json()).results || [])[0];
      return person ? person.id : null;
    }

    async function findKeywordIds(text) {
      const parts = text.split(",").map(s => s.trim()).filter(Boolean).slice(0, 4);
      const ids = [];
      for (const part of parts) {
        const res = await fetch(`https://api.themoviedb.org/3/search/keyword?api_key=${apiKey}&query=${encodeURIComponent(part)}`);
        if (!res.ok) continue;
        const hit = ((await res.json()).results || [])[0];
        if (hit) ids.push(hit.id);
      }
      return ids;
    }

    async function searchTMDB(type, keywordIds, sort, castId) {
      const sortBy = tmdbSort(type, sort);
      let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${apiKey}&sort_by=${sortBy}&language=en-US&page=1`;
      if (sort.startsWith("vote")) url += "&vote_count.gte=50";
      if (selectedGenres.size) url += `&with_genres=${[...selectedGenres].join(",")}`;
      if (keywordIds.length) url += `&with_keywords=${keywordIds.join("|")}`;
      if (castId) url += `&with_cast=${castId}`;
      if (selectedPlatforms.size && selectedPlatforms.size < PLATFORMS.length) {
        url += `&with_watch_providers=${[...selectedPlatforms].join("|")}&watch_region=US`;
      }
      const res = await fetch(url);
      if (!res.ok) throw new Error("API failed");
      return (await res.json()).results || [];
    }

    function displayResults(items) {
      document.getElementById("resultCount").textContent = items.length + " results";
      const container = document.getElementById("results");
      if (!items.length) { 
        container.innerHTML = '<div class="text-center text-gray-500 py-12">No matches. Try different genres.</div>'; 
        return; 
      }
      container.innerHTML = items.map(item => {
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || "").slice(0,4);
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w200${item.poster_path}` : "";
        const id = item.id;
        const type = item.media_type;
        return `
          <div class="card bg-white rounded-2xl overflow-hidden shadow border flex cursor-pointer" data-id="${id}" data-type="${type}" onclick="showDetail(this)">
            ${poster ? `<img src="${poster}" class="w-20 h-30 object-cover">` : '<div class="w-20 bg-gray-200"></div>'}
            <div class="p-3 flex-1">
              <div class="font-semibold">${title}</div>
              <div class="text-xs text-gray-500">${year} • ${type === "tv" ? "Series" : "Movie"}</div>
              <div class="text-xs mt-1 text-gray-600 episode-info" data-id="${id}" data-type="${type}"></div>
              <div class="text-xs mt-1 line-clamp-2">${item.overview || ""}</div>
              <div class="platforms text-xs mt-2 ll-link" data-id="${id}" data-type="${type}">Checking platforms...</div>
            </div>
          </div>`;
      }).join("");

      // Fetch platforms and episode info for each
      items.forEach(item => fetchExtraInfo(item));
    }

    async function fetchExtraInfo(item) {
      const id = item.id;
      const type = item.media_type;
      // Episode count
      if (type === "tv") {
        try {
          const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${apiKey}`);
          const d = await res.json();
          const eps = d.number_of_episodes || 0;
          const seasons = d.number_of_seasons || 0;
          const el = document.querySelector(`.episode-info[data-id="${id}"]`);
          if (el) el.textContent = `${seasons} season${seasons !== 1 ? "s" : ""} • ${eps} episode${eps !== 1 ? "s" : ""}`;
        } catch(e) {}
      }
      // Platforms / streaming count
      try {
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}/watch/providers?api_key=${apiKey}`);
        const data = await res.json();
        const us = data.results?.US?.flatrate || [];
        const matching = us.filter(p => selectedPlatforms.has(p.provider_id) || selectedPlatforms.size === PLATFORMS.length);
        const names = matching.map(p => p.provider_name).slice(0, 4);
        const el = document.querySelector(`.platforms[data-id="${id}"]`);
        if (el) {
          el.textContent = names.length 
            ? `On ${matching.length} service${matching.length !== 1 ? "s" : ""}: ${names.join(", ")}` 
            : "Not on your selected services";
        }
      } catch(e) {
        const el = document.querySelector(`.platforms[data-id="${id}"]`);
        if (el) el.textContent = "Platforms unavailable";
      }
    }

    async function showDetail(el) {
      const id = el.dataset.id;
      const type = el.dataset.type;
      document.getElementById("results").innerHTML = '<div class="text-center py-8">Loading details...</div>';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${apiKey}`);
        const d = await res.json();
        const title = d.title || d.name;
        const year = (d.release_date || d.first_air_date || "").slice(0,4);
        const poster = d.poster_path ? `https://image.tmdb.org/t/p/w300${d.poster_path}` : "";
        let bingeInfo = "";
        if (type === "tv") {
          const episodes = d.number_of_episodes || 0;
          const seasons = d.number_of_seasons || 0;
          const status = d.status || "";
          const next = d.next_episode_to_air;
          bingeInfo = `<p class="mt-2 text-sm text-gray-600">${seasons} season${seasons !== 1 ? "s" : ""} • ${episodes} episode${episodes !== 1 ? "s" : ""}</p>`;
          if (status === "Ended" || (episodes > 0 && !next)) {
            bingeInfo += `<p class="mt-2 text-green-700 font-medium"><i class="fas fa-check-circle mr-1"></i> Bingeable — all ${episodes} episodes available</p>`;
          } else if (next) {
            const date = new Date(next.air_date);
            const day = date.toLocaleDateString(undefined, { weekday: "long" });
            bingeInfo += `<p class="mt-2 text-blue-700 font-medium"><i class="fas fa-calendar-alt mr-1"></i> Episodic — New episodes on ${day}s</p>
                         <p class="text-sm text-gray-600">Next: S${next.season_number}E${next.episode_number} on ${next.air_date}</p>`;
          } else {
            bingeInfo += `<p class="mt-2 text-gray-600">Series status: ${status}</p>`;
          }
        } else {
          bingeInfo = `<p class="mt-3 text-green-700 font-medium"><i class="fas fa-film mr-1"></i> Movie — Watch anytime</p>`;
        }
        document.getElementById("results").innerHTML = `
          <div class="card bg-white rounded-2xl overflow-hidden shadow border p-4">
            <button onclick="goBack()" class="ll-link text-sm mb-3"><i class="fas fa-arrow-left mr-1"></i> Back to list</button>
            ${poster ? `<img src="${poster}" class="w-full max-w-xs mx-auto rounded-xl mb-4">` : ""}
            <h2 class="text-2xl">${title} (${year})</h2>
            <p class="text-sm text-gray-600 mt-2">${d.overview || ""}</p>
            ${bingeInfo}
          </div>`;
      } catch(e) {
        document.getElementById("results").innerHTML = `<div class="text-center text-red-500 py-8">Couldn't load details</div>`;
      }
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
